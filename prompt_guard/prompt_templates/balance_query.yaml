# 余额查询模板
intent: balance_query
intent_name: 余额查询

# 追加到基础 system prompt 的上下文
system_prompt_additions: |
  当前用户持有账户类型：{account_types}
  各账户余额信息：{balances}
  请仅提供余额查询相关信息，不要主动推荐理财产品。

# 用户消息模板 (处理后替换 user_input)
template: |
  {user_input}

# 输出要求 (注入到 system prompt 末尾)
output_requirements: |
  请仅回答与余额查询相关的内容。
  如果涉及具体金额，请使用用户的实际余额数据。
  不要推荐任何理财产品。
  如果用户未指定账户类型，请询问需要查询哪个账户。
  回答应简洁、准确、友好。
